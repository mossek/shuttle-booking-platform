name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests (pytest)
        run: pytest

  # Build the image (and push it, but only from main)
  # ===========================================================================
  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Work out the image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image tar
        run: docker save "${{ env.IMAGE }}:${{ github.sha }}" -o "${{ runner.temp }}/image.tar"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-tar
          path: ${{ runner.temp }}/image.tar

  # Trivy image scan
  # ===========================================================================
  scan:
    name: Scan
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-tar
          path: ${{ runner.temp }}

      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/image.tar
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  # push docker image to GitHub Container Registry (GHCR)
  # ===========================================================================
  push:
    name: Push
    needs: scan
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: image-tar
          path: ${{ runner.temp }}
      - name: Load the image
        run: docker load -i "${{ runner.temp }}/image.tar"

      - name: Work out the image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image to GitHub Container Registry
        run: |
          docker tag "${IMAGE}:${{ github.sha }}" "${IMAGE}:latest"
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"


      - name: sign in to Azure (OIDC - no secrets)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Push the image to Azure Container Registry
        run: |
          ACR="${{ vars.ACR_NAME }}.azurecr.io/shuttle-booking-platform"
          az acr login --name "${{ vars.ACR_NAME }}"
          docker tag "${IMAGE}:${{ github.sha }}" "${ACR}:${{ github.sha }}"
          docker push "${ACR}:${{ github.sha }}"

  deploy:
    name: Deploy
    needs: push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: sign in to Azure (OIDC - no secrets)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy the new image to container Apps
        run:
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp update \
            --name shuttle-booking-platform \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image "${{ vars.ACR_NAME }}.azurecr.io/shuttle-booking-platform:${{ github.sha }}"

      - name: Verify the new version is live
        run: |
          FQDN=$(az containerapp show --name shuttle-booking-platform --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)
          echo "Waiting for the new version to be live at https://${FQDN}..." 
          for i in ${seq 1 12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${FQDN}/health")
            if [ "$STATUS" -eq 200 ]; then
              echo "New version is live!"
              exit 0
            fi
            echo "Attempt $i: New version not live yet (status code: $STATUS). Retrying in 10 seconds..."
            sleep 10
          done
          echo "New version did not become live after 2 minutes. Please check the deployment."
          exit 1