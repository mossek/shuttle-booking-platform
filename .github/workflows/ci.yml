name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests (pytest)
        run: pytest

      - name: Check migrations match models
        run: |
           alembic upgrade head
           alembic check

  # Build the image (and push it, but only from main)
  # ===========================================================================
  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Work out the image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image tar
        run: docker save "${{ env.IMAGE }}:${{ github.sha }}" -o "${{ runner.temp }}/image.tar"

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: image-tar
          path: ${{ runner.temp }}/image.tar

  # Trivy image scan
  # ===========================================================================
  scan:
    name: Scan
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: image-tar
          path: ${{ runner.temp }}

      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/image.tar
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  # push docker image to GitHub Container Registry (GHCR)
  # ===========================================================================
  push:
    name: Push
    needs: scan
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      acr_name: ${{ steps.find-acr.outputs.name }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: image-tar
          path: ${{ runner.temp }}
      - name: Load the image
        run: docker load -i "${{ runner.temp }}/image.tar"

      - name: Work out the image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image to GitHub Container Registry
        run: |
          docker tag "${IMAGE}:${{ github.sha }}" "${IMAGE}:latest"
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"


      - name: sign in to Azure (OIDC - no secrets)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Find the container registry in the resource group
        id: find-acr
        run: |
          NAMES=$(az acr list --resource-group "${{ vars.RESOURCE_GROUP }}" --query "[].name" -o tsv)
          COUNT=$(echo "$NAMES" | grep -c .)
          if [ "$COUNT" -ne 1 ]; then
            echo "Expected exactly 1 registry in ${{ vars.RESOURCE_GROUP }}, found $COUNT: $NAMES"
            exit 1
          fi
          echo "Using registry: $NAMES"
          echo "ACR_NAME=$NAMES" >> "$GITHUB_ENV"
          echo "name=$NAMES"     >> "$GITHUB_OUTPUT"
      
      - name: Push the image to Azure Container Registry
        run: |
          ACR="${ACR_NAME}.azurecr.io/shuttle-booking-platform"
          az acr login --name "$ACR_NAME"
          docker tag "${IMAGE}:${{ github.sha }}" "${ACR}:${{ github.sha }}"
          docker push "${ACR}:${{ github.sha }}"

  # ===========================================================================
  # Deploy with blue-green and automatic rollback.
  #   blue  = the revision customers use right now
  #   green = the new version
  # Green starts with 0% of the traffic. It only gets customers after it
  # passes its health check. If anything fails, traffic stays on (or goes
  # back to) blue and the job turns red - customers never see a broken version.
  # Portal: Container App -> Revisions and replicas (traffic % per revision).
  # ===========================================================================
  deploy:
    name: Deploy
    needs: push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Never run two deploys at once - they would fight over the traffic split
    concurrency:
      group: deploy-${{ vars.CONTAINER_APP }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      APP: ${{ vars.CONTAINER_APP }}
      RG: ${{ vars.RESOURCE_GROUP }}
      IMAGE: ${{ needs.push.outputs.acr_name }}.azurecr.io/shuttle-booking-platform:${{ github.sha }}
    steps:
      - name: sign in to Azure (OIDC - no secrets)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Pin all traffic to the current revision (blue)
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          # Blue = the revision that has customers right now
          BLUE=$(az containerapp ingress traffic show -n "$APP" -g "$RG" \
            --query "[?weight > \`0\` && revisionName != null].revisionName | [0]" -o tsv)
          if [ -z "$BLUE" ]; then
            # First run after the switch to Multiple: traffic says "latest revision"
            BLUE=$(az containerapp show -n "$APP" -g "$RG" \
              --query properties.latestReadyRevisionName -o tsv)
          fi
          # Pinning by NAME (not "latest") means a new revision gets 0% traffic
          az containerapp ingress traffic set -n "$APP" -g "$RG" \
            --revision-weight "$BLUE=100" -o none
          echo "Blue (live) revision: $BLUE"
          echo "BLUE=$BLUE" >> "$GITHUB_ENV"

      - name: Start the new version (green) with no traffic
        run: |
          # Revision name = <app>--<suffix>. The run attempt keeps re-runs unique.
          SUFFIX="v${GITHUB_SHA::7}-${GITHUB_RUN_ATTEMPT}"
          GREEN="${APP}--${SUFFIX}"
          echo "GREEN=$GREEN" >> "$GITHUB_ENV"
          az containerapp update -n "$APP" -g "$RG" \
            --image "$IMAGE" --revision-suffix "$SUFFIX" -o none
          echo "Green revision: $GREEN (0% traffic)"

      - name: Test green directly, before any customer sees it
        run: |
          # In Multiple revision mode every revision has its own private-ish URL
          GREEN_FQDN=$(az containerapp revision show -n "$APP" -g "$RG" \
            --revision "$GREEN" --query properties.fqdn -o tsv)
          echo "Testing https://${GREEN_FQDN}/health/db"
          for i in $(seq 1 30); do
            BODY=$(curl -s --max-time 15 "https://${GREEN_FQDN}/health/db" || true)
            VERSION=$(echo "$BODY" | jq -r .version 2>/dev/null || echo "unreachable")
            DB=$(echo "$BODY" | jq -r .database 2>/dev/null || echo "unknown")
            if [ "$VERSION" = "$GITHUB_SHA" ] && [ "$DB" = "ok" ]; then
              echo "Green is healthy: version $VERSION, database $DB"
              exit 0
            fi
            echo "Attempt $i/30: version '$VERSION', database '$DB' - waiting 10s..."
            sleep 10
          done
          echo "Green never became healthy - customers stay on blue."
          exit 1

      - name: Switch customers to green
        run: |
          az containerapp ingress traffic set -n "$APP" -g "$RG" \
            --revision-weight "$GREEN=100" -o none
          echo "100% of traffic now on $GREEN"

      - name: Check the public URL serves green
        run: |
          FQDN=$(az containerapp show -n "$APP" -g "$RG" \
            --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 12); do
            BODY=$(curl -s --max-time 15 "https://${FQDN}/health/db" || true)
            VERSION=$(echo "$BODY" | jq -r .version 2>/dev/null || echo "unreachable")
            DB=$(echo "$BODY" | jq -r .database 2>/dev/null || echo "unknown")
            if [ "$VERSION" = "$GITHUB_SHA" ] && [ "$DB" = "ok" ]; then
              echo "Live at https://${FQDN}: version $VERSION"
              exit 0
            fi
            echo "Attempt $i/12: version '$VERSION', database '$DB' - waiting 10s..."
            sleep 10
          done
          echo "Public URL is not healthy on green."
          exit 1

      # Runs ONLY if a step above failed: put customers back on blue
      - name: Roll back to blue
        if: failure() && env.BLUE != ''
        run: |
          echo "::error::Deploy failed - rolling back to $BLUE"
          az containerapp ingress traffic set -n "$APP" -g "$RG" \
            --revision-weight "$BLUE=100" -o none
          if [ -n "${GREEN:-}" ]; then
            az containerapp revision deactivate -n "$APP" -g "$RG" --revision "$GREEN" -o none || true
            echo "Deactivated the failed revision $GREEN"
          fi
          echo "Customers are on $BLUE again."

      # Success: keep blue (switched off traffic, scaled to zero) for a quick
      # manual rollback; deactivate anything older so revisions don't pile up.
      - name: Tidy up old revisions
        if: success()
        run: |
          for REV in $(az containerapp revision list -n "$APP" -g "$RG" \
              --query "[?properties.active].name" -o tsv); do
            if [ "$REV" != "$GREEN" ] && [ "$REV" != "$BLUE" ]; then
              az containerapp revision deactivate -n "$APP" -g "$RG" --revision "$REV" -o none
              echo "Deactivated $REV"
            fi
          done
